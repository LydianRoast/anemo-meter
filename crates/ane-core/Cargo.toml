[package]
name = "ane-core"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "ANE-200W readings, evidence, capture state, and airflow analysis"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
csv = "1"
rusqlite = { version = "0.36", features = ["bundled"] }

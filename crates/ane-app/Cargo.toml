[package]
name = "ane-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ane-console"
path = "src/main.rs"

[dependencies]
ane-core = { path = "../ane-core" }
anyhow = "1"
eframe = { version = "=0.32.3", default-features = false, features = ["glow", "default_fonts", "android-native-activity", "x11", "wayland"] }
btleplug = "=0.12.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
chrono = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
rfd = { version = "0.15", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.21"
jni_legacy = { package = "jni", version = "0.19" }
ndk-context = "0.1"
android_logger = "0.15"
log = "0.4"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
